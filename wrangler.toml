name = "shidduch-ledger"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# After you create your D1 database (Cloudflare dashboard: Workers & Pages ->
# D1 -> Create database, or `wrangler d1 create shidduch-ledger-db`), paste
# its database_id below. This file is only used for local dev
# (`wrangler pages dev .`) — when Pages deploys from GitHub, you bind D1 in
# the dashboard instead (Pages project -> Settings -> Functions -> D1 database
# bindings), so don't worry if you skip local dev entirely.
[[d1_databases]]
binding = "DB"
database_name = "shidduch-ledger-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
